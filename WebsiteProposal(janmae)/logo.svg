<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="logoGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#logoGrad2)"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="url(#logoGrad)" stroke-width="3" opacity="0.4"/>
  
  <!-- Main bite/dash icon -->
  <g transform="translate(64, 64)">
    <!-- Circle base -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#logoGrad)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Dish/plate shape -->
    <path d="M -14 12 A 12 12 0 1 1 14 12 A 6 6 0 0 0 0 6 Z" fill="url(#logoGrad)" opacity="0.9"/>
    
    <!-- Dash line / arrow -->
    <path d="M -10 -8 L 0 0 L 10 -8" fill="none" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bite mark -->
    <path d="M -6 -4 Q -8 -8 -6 -12 Q -4 -14 -2 -12 Q -2 -8 -4 -6" fill="url(#logoGrad)" stroke="url(#logoGrad)" stroke-width="2"/>
  </g>
  
  <!-- Small decorative dots -->
  <circle cx="-30" cy="-30" r="4" fill="#F97316" opacity="0.6"/>
  <circle cx="30" cy="30" r="4" fill="#EA580C" opacity="0.6"/>
  <circle cx="-30" cy="30" r="3" fill="#F97316" opacity="0.4"/>
  <circle cx="30" cy="-30" r="3" fill="#EA580C" opacity="0.4"/>
</svg>
